spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: url_user
    password: url_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8080
