services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-db

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_user
      POSTGRES_PASSWORD: url_password

    ports:
      - "5432:5432"

    volumes:
      - url_shortener_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_user -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  url_shortener_data:
